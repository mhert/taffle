name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump (Semantic Versioning)"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Preview the bump and build artifacts without committing, tagging, or releasing (uncheck for a real release)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release must never be cut short: cancelling one mid-flight can stop it after
# the bump commit and the tag have been pushed but before any asset was uploaded,
# leaving a published tag with nothing behind it and a draft release nobody
# finishes. A second dispatch therefore queues behind the first rather than
# killing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - id: v
        name: Resolve version and mode
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event.inputs.dry_run }}
          BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Re-running a real dispatched release does not resume the one that failed,
          # it mints another: the tag the first attempt pushed is now the floor, so
          # the bump below returns the next version and the whole commit-tag-draft
          # sequence runs again, orphaning the release already published. Refuse
          # instead. A dry run touches nothing, so it stays freely re-runnable.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY" = "false" ] && [ "$ATTEMPT" != "1" ]; then
            echo "::error::attempt $ATTEMPT of a real release would create a second version and orphan the one the first attempt released; dispatch a fresh run instead"
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"; is_release=true; ref=""
            # Every artifact is named after the tag, but the binaries inside them are
            # built from this checkout, so a tag pushed at a commit whose workspace
            # version differs would ship a 0.2.0 package holding a binary that reports
            # 0.1.0 -- and nothing downstream would notice, because the deb version,
            # the PKGBUILD pkgver and the installer's -DVERSION are all injected from
            # the tag. Read the field with the same anchored expression
            # scripts/bump-version.sh writes it with, so the two agree on which line
            # is the workspace version.
            committed="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml | head -n1)"
            if [ "$version" != "$committed" ]; then
              echo "::error::tag v$version was pushed at a commit whose workspace version is $committed; the artifacts would be named for a version their binaries do not report"
              exit 1
            fi
          else
            # Dispatch: bump the selected component from the newest published
            # version, not this checkout's committed version. The floor is the
            # highest vX.Y.Z tag on origin; bumping from it keeps releases moving
            # forward even if the committed version has drifted behind the last
            # release (e.g. after a history rewrite). With no tags the floor is
            # empty and bump-version.sh falls back to the committed version. This
            # edits the working tree (Cargo.toml, Cargo.lock, packaging/arch/PKGBUILD);
            # the commit step below persists it on a real release, and a dry run
            # discards it with the job.
            floor="$(git ls-remote --tags origin 'v*' 2>/dev/null \
              | sed -E 's#.*refs/tags/v##; s#\^\{\}$##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1 || true)"
            version="$(BUMP_FLOOR="$floor" sh scripts/bump-version.sh "$BUMP")"
            if [ "$DRY" = "false" ]; then is_release=true; ref="v$version"; else is_release=false; ref=""; fi
          fi
          {
            echo "version=$version"
            echo "is_release=$is_release"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Commit bump, tag, and draft release
        if: steps.v.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # On a manual real release, persist the bump and create the tag in THIS run.
          # Pushes made with GITHUB_TOKEN (both the branch push and the tag push) do not
          # trigger any workflow, so this re-runs neither CI nor Release -- nothing here
          # depends on that: every build job runs in this same run and builds the tagged
          # commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The bump was applied to the working tree in the previous step.
            git add Cargo.toml Cargo.lock packaging/arch/PKGBUILD
            git commit -m "chore(release): v$VERSION"
            git push origin "HEAD:$BRANCH"
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          # A release triggered by a tag push can be re-run, and the tag it was named
          # for already exists, so the draft the first attempt created is still there.
          # An unconditional create would die on "already_exists" and leave the
          # operator to delete that draft by hand before retrying.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; leaving it as it is"
          else
            gh release create "v$VERSION" --draft --title "v$VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  # Distro-native Debian/Ubuntu packages: each builds in its own distro container
  # so the binary links that distro's libopus and the Depends resolve against it.
  deb:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", tag: ubuntu24.04 }
          - { image: "debian:13", tag: debian13 }
    container: ${{ matrix.image }}
    steps:
      - name: Build deps
        run: |
          apt-get update
          # ca-certificates: the container has none, so the rustup installer's
          # HTTPS download fails with a curl (77) certificate error otherwise.
          # python3: scripts/smoke.sh writes its test WAV with it.
          # The qt6 dev packages are what taffle-gui's build script compiles its QML module
          # against; the qml6 modules are what the installed binary imports at run time, which
          # is what the smoke below exercises.
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libopus-dev python3 \
            qt6-base-dev qt6-declarative-dev qml6-module-qtqml qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtquick-dialogs
          # gh is not in the distro repos, and the release upload runs inside this
          # container, so install it from GitHub's apt repository.
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - name: Rust and cargo-deb
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0
          . "$HOME/.cargo/env"
          # Pinned like every other toolchain in this workflow: this is the tool that
          # builds the package Debian and Ubuntu users install, so a new version of it
          # must not reach a release without somebody having looked at it first.
          cargo install cargo-deb --version 3.7.0 --locked
      - name: Build + package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked -p taffle-cli -p taffle-gui
          # Each package is renamed as it is built rather than both afterwards: the two runs
          # write into the same target/debian, so one glob at the end would see two files.
          cargo deb -p taffle-cli --no-build --deb-version "$VERSION"
          mv target/debian/taffle-cli_*.deb "taffle-cli_${VERSION}_amd64_${{ matrix.tag }}.deb"
          cargo deb -p taffle-gui --no-build --deb-version "$VERSION"
          mv target/debian/taffle-gui_*.deb "taffle-gui_${VERSION}_amd64_${{ matrix.tag }}.deb"
      - name: The command-line package declares the libopus it links
        # A package whose $auto silently resolved to nothing installs cleanly and
        # then fails to run, which is the worse failure of the two because it
        # reaches the user rather than the build.
        run: |
          dpkg -I taffle-cli_*_${{ matrix.tag }}.deb
          dpkg -I taffle-cli_*_${{ matrix.tag }}.deb | grep -q 'Depends:.*libopus'
      - name: The GUI package declares the Qt it links
        # Same failure, one library further: the GUI binary is nothing without Qt, so a $auto
        # that resolved to no Qt at all is a package that installs and then will not start.
        # The pattern is libqt6 rather than qt because the manifest also names the qml6-module
        # packages outright, and those would satisfy a looser pattern whether or not $auto
        # resolved anything at all; only dpkg-shlibdeps can put a libqt6* library package in
        # this field. The hand-written module names need no grep of their own: a name that does
        # not exist fails the install in the next step.
        run: |
          dpkg -I taffle-gui_*_${{ matrix.tag }}.deb
          dpkg -I taffle-gui_*_${{ matrix.tag }}.deb | grep -q 'Depends:.*libqt6'
      - name: Install both and put each through its own smoke
        run: |
          apt-get install -y ./taffle-cli_*_${{ matrix.tag }}.deb ./taffle-gui_*_${{ matrix.tag }}.deb
          sh scripts/smoke.sh taffle
          # The frontend's own self-test, run against what the package installed rather than what
          # the build produced: it boots the whole QML chrome offscreen and exits. The style is
          # pinned to the one Qt itself ships, as the crate's test run does, so a distro's default
          # style is not what decides this lane. The bound is the same 30 seconds that test allows
          # the run, so a boot that never finishes fails here instead of sitting until the job's
          # own ceiling with nothing said.
          #
          # This is also the only place a distro Qt runs this chrome at all — the CI test lanes
          # pin Qt's own 6.7.2 against a hang seen on a different frontend under Ubuntu's 6.4.2 —
          # so what comes back here, on the first dry run, is what says whether that pin is a
          # version preference or a requirement.
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic \
            QT_FORCE_STDERR_LOGGING=1 timeout 30 taffle-gui --smoke
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "${{ needs.prepare.outputs.is_release }}" != "true" ]; then exit 0; fi
          gh release upload "v$VERSION" \
            taffle-cli_*_${{ matrix.tag }}.deb \
            taffle-gui_*_${{ matrix.tag }}.deb --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "deb-${{ matrix.tag }}", path: "*.deb" }

  # Distro-native Arch package: makepkg only runs on Arch, so this builds in an
  # archlinux container and ships the built package plus the PKGBUILD.
  arch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      # The archlinux image ships no git, so actions/checkout would fall back to
      # an API tarball with no .git and the git archive below would fail; install
      # git first so checkout clones a real repository.
      - name: Install git before checkout
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - name: Toolchain
        # github-cli: the release upload runs inside this container.
        # python: scripts/smoke.sh writes its test WAV with it.
        # qt6-base/qt6-declarative: the PKGBUILD's makedepends. makepkg runs unprivileged here
        # and cannot install a missing one itself, so they are put in front of it.
        run: pacman -Syu --noconfirm base-devel git namcap rust opus python github-cli qt6-base qt6-declarative
      - name: Materialize PKGBUILD for this version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp packaging/arch/PKGBUILD .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          git config --global --add safe.directory '*'
          # makepkg uses a same-named local file over the source= URL (checksums
          # skipped below), so the dry run builds without any published tag
          # existing yet.
          git archive --format=tar.gz \
            --prefix="taffle-$VERSION/" \
            -o "taffle-$VERSION.tar.gz" HEAD
          useradd -m builder && chown -R builder .
      - name: makepkg + namcap
        # namcap stays advisory: it reports packaging opinions, not build failures.
        run: |
          sudo -u builder namcap PKGBUILD || true
          sudo -u builder makepkg -f --skipchecksums --noconfirm
      - name: Install both and put each through its own smoke
        # One PKGBUILD, two packages: the glob takes whatever makepkg wrote.
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          sh scripts/smoke.sh taffle
          # The frontend's own self-test against the binary the package installed, bounded and
          # pinned to Qt's own style for the reasons the deb job states.
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic \
            QT_FORCE_STDERR_LOGGING=1 timeout 30 taffle-gui --smoke
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "${{ needs.prepare.outputs.is_release }}" != "true" ]; then exit 0; fi
          gh release upload "v$VERSION" PKGBUILD --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "v$VERSION" ./*.pkg.tar.zst --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: |
            PKGBUILD
            *.pkg.tar.zst

  # macOS gets tarballs rather than packages: there is no system package manager to
  # install into, so each program has to be self-contained. The command carries its
  # libopus; the window is an app bundle, carrying that same libopus and the Qt it
  # draws itself with.
  macos:
    needs: prepare
    runs-on: ${{ matrix.os }}
    # 60 rather than the 45 this job held while it built the command line alone: it now
    # installs a Qt as well, compiles the frontend's cxx-qt shim layer — generated C++,
    # moc, and the QML module — against it, and deploys that Qt into a bundle. The Windows
    # job builds the same two programs and is given the same hour.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: aarch64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - run: rustup show
      - name: Install libopus
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install Qt 6.7.2 via aqt
        # Qt's own binaries rather than anything the runner ships: the frontend's build script
        # compiles its QML module against them, and macdeployqt below copies them into the
        # bundle. 6.7.2 is the version the frontend was developed against. No LD_LIBRARY_PATH
        # counterpart is needed: linking against Qt's frameworks records an rpath into this
        # prefix, so the build's own binary finds them wherever it is started from.
        run: |
          pipx install aqtinstall
          # pipx installs its entry points into PIPX_BIN_DIR, which this image puts on PATH
          # for interactive shells only — and a workflow step is not one. Ask pipx where it
          # put aqt rather than hoping the directory is on PATH.
          "$(pipx environment --value PIPX_BIN_DIR)/aqt" \
            install-qt mac desktop 6.7.2 clang_64 -O "$HOME/Qt"
          qt=$(ls -d "$HOME"/Qt/6.7.2/*/); qt="${qt%/}"
          echo "$qt/bin" >> "$GITHUB_PATH"
          echo "QMAKE=$qt/bin/qmake6" >> "$GITHUB_ENV"
      - name: Build
        # LIBOPUS_STATIC folds Homebrew's libopus.a into both binaries. Without it a tarball
        # would only run on a machine that happens to have Homebrew's opus installed at the
        # same prefix.
        env:
          LIBOPUS_STATIC: "1"
        run: cargo build --release --locked -p taffle-cli -p taffle-gui
      - name: Both binaries carry their libopus rather than expecting one
        # The window links Qt as frameworks by design and carries a copy of them below, but it
        # decodes Opus through the same static library the command does, so it is held to the
        # same reading: a program that unpacks cleanly and then cannot decode a thing is the
        # worse failure of the two, because it reaches the user rather than the build.
        run: |
          for binary in target/release/taffle target/release/taffle-gui; do
            otool -L "$binary"
            if otool -L "$binary" | grep -qi opus; then
              echo "::error::$binary still links libopus dynamically"
              exit 1
            fi
          done
      - name: Stage the command line
        run: |
          mkdir -p stage
          cp target/release/taffle stage/taffle
          cp LICENSE README.md stage/
      - name: Convert real audio with the staged binary
        run: sh scripts/smoke.sh ./stage/taffle
      - name: Assemble Taffle.app and let macdeployqt bundle the Qt it needs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        # An app bundle is what macOS takes a window to be: a directory holding the binary, the
        # icon, and the Info.plist naming both, which Finder shows as the one Taffle a user drags
        # into /Applications. The committed plist carries a 0.0.0 placeholder and plutil writes
        # the version being released over it — which is why that placeholder has to be a key
        # already in the file rather than a token to substitute: -replace has nothing to replace
        # otherwise.
        #
        # macdeployqt copies the Qt frameworks the binary links into Contents/Frameworks and
        # rewrites its load paths to reach them there. What it cannot read off a binary is QML:
        # the chrome's modules are compiled into the executable as resources, so -qmldir points
        # it at the same QML sources the build compiled and it learns from their import lines
        # which QtQuick modules and style plugins to bundle.
        run: |
          app="stage-gui/Taffle.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
          cp target/release/taffle-gui "$app/Contents/MacOS/taffle-gui"
          cp packaging/linux/taffle.icns "$app/Contents/Resources/taffle.icns"
          cp LICENSE README.md stage-gui/
          macdeployqt "$app" -qmldir=crates/taffle-gui/qml
      - name: Put the bundle through the window's own smoke, with Qt's own build gone
        # The window is proven the only way a bundled Qt tree can be: started. The self-test
        # boots the whole chrome, drives a fake batch through it and exits, so a framework or a
        # QML module macdeployqt did not bundle fails here rather than on the first user's
        # machine.
        #
        # Qt's own build is moved out of the way first, and nothing after this step wants it
        # back. This job installed it to compile against; leaving it where the binary was linked
        # to find it would let a framework or an import the bundle never got be resolved from
        # there instead, and the run would pass on a machine no user has.
        #
        # No display server and a software scene graph, the pair the crate's own smoke test puts
        # on the run. The Qt Quick Controls style is left at whatever the platform picks, where
        # that test pins it to Basic: which style macOS resolves to is part of what macdeployqt
        # had to bundle, and pinning Basic would pass with it missing.
        run: |
          mv "$HOME/Qt" "$HOME/Qt-build-only"
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            stage-gui/Taffle.app/Contents/MacOS/taffle-gui --smoke
      - name: Tar
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        # Each archive is named for the program it carries, so the two macOS files on a release
        # page say which is which. Only the name changed for the command line: the archive holds
        # what it always held, and unpacks the same way.
        run: |
          tar -czf "taffle-cli-$VERSION-${{ matrix.arch }}-macos.tar.gz" -C stage .
          tar -czf "taffle-gui-$VERSION-${{ matrix.arch }}-macos.tar.gz" -C stage-gui .
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "${{ needs.prepare.outputs.is_release }}" != "true" ]; then exit 0; fi
          gh release upload "v$VERSION" \
            "taffle-cli-$VERSION-${{ matrix.arch }}-macos.tar.gz" \
            "taffle-gui-$VERSION-${{ matrix.arch }}-macos.tar.gz" --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "macos-${{ matrix.arch }}", path: "taffle-*-macos.tar.gz" }

  # Windows: one build feeds four artifacts — a portable zip and an installer for
  # each of the two programs.
  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # No pkg-config on Windows, so audiopus_sys builds its vendored libopus with
      # CMake. That copy declares `cmake_minimum_required(VERSION 3.1)`, which
      # CMake 4 refuses outright.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - run: rustup show
      - name: Install Qt 6.7.2 via aqt
        shell: pwsh
        # Qt's own binaries rather than anything the runner ships: the frontend's build script
        # compiles its QML module against them, and windeployqt below bundles them. 6.7.2 ships
        # a win64_msvc2019_64 build and no 2022 one; the runner's MSVC 2022 compiles the C++
        # shims against it, the two share an ABI. Windows reads no rpath, so Qt's DLLs are found
        # through PATH — and that entry has to be a native path, which is why this step is
        # PowerShell rather than bash.
        run: |
          pipx install aqtinstall
          aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O "$HOME\Qt"
          $qt = (Get-ChildItem -Directory "$HOME\Qt\6.7.2")[0].FullName
          Add-Content -Path $env:GITHUB_PATH -Value "$qt\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "QMAKE=$qt\bin\qmake6.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "QT_BIN=$qt\bin"
      - run: cargo build --release --locked -p taffle-cli -p taffle-gui
      - name: Stage the command line
        shell: bash
        run: |
          mkdir -p stage
          cp target/release/taffle.exe stage/taffle.exe
          cp LICENSE README.md stage/
      - name: The command-line binary is self-contained
        shell: bash
        # crt-static (.cargo/config.toml) folds the MSVC runtime into the .exe.
        # Prove it held: a dynamically-linked binary names VCRUNTIME140.dll in its
        # PE import table (plain ASCII in the file) — the exact DLL a clean Windows
        # install lacks. This runner has the VC++ redistributable installed, so
        # launching the binary here would succeed even after a regression;
        # scanning the imports is what catches it.
        #
        # Only the command line is held to this. The window links Qt as DLLs by design — the
        # Qt build it compiles against ships no static libraries — so it carries a copy of
        # them beside it, and is proven the other way below: installed, then started.
        run: |
          if grep -aiq 'VCRUNTIME140' stage/taffle.exe; then
            echo "::error::taffle.exe still dynamically links the MSVC runtime (VCRUNTIME140.dll)"
            exit 1
          fi
          echo "stage/taffle.exe: self-contained (no VCRUNTIME140 import)"
      - name: Convert real audio with the staged binary
        shell: bash
        run: sh scripts/smoke.sh ./stage/taffle.exe
      - name: Stage the window and let windeployqt bundle the Qt it needs
        shell: bash
        # windeployqt reads the binary's imports for the Qt libraries and copies them in beside
        # it, together with the plugins Qt loads by name rather than by import. What it cannot
        # read off a binary is QML: the chrome's modules are compiled into the executable as
        # resources, so --qmldir points it at the same QML sources the build compiled and it
        # learns from their import lines which QtQuick modules and style plugins to bundle.
        # --no-translations because nothing here is translated: Qt's catalogs would be
        # megabytes of nothing.
        run: |
          mkdir -p stage-gui
          cp target/release/taffle-gui.exe stage-gui/taffle-gui.exe
          cp LICENSE README.md stage-gui/
          windeployqt --qmldir crates/taffle-gui/qml --no-translations stage-gui/taffle-gui.exe
      - name: Put the MSVC runtime beside the window
        shell: bash
        # crt-static folds that runtime into the command-line binary; it cannot do the same here,
        # because the Qt libraries staged above are Microsoft's own build and link it dynamically.
        # A Windows that has never had a Visual Studio redistributable installed therefore cannot
        # start the window -- and nothing else in this job would notice, because this runner has
        # the redistributable and finds those DLLs in System32. Microsoft allows the same DLLs to
        # be deployed in an application's own directory, which is what happens here: Windows
        # searches the directory of the running executable ahead of System32, and that is
        # taffle-gui.exe's directory for every DLL in the tree, plugins included, so one copy
        # beside it serves all of them.
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          redist="$(cygpath -u "$("$vswhere" -latest -property installationPath | tr -d '\r')")/VC/Redist/MSVC"
          # One directory per toolset the installation carries; the newest is taken because the
          # 140-series runtime is binary compatible across Visual Studio 2015 through 2022, so it
          # serves both what this runner's compiler built and the Qt an older toolset built.
          crt=$(find "$redist" -maxdepth 3 -type d -path '*/x64/Microsoft.VC[0-9][0-9][0-9].CRT' 2>/dev/null | sort -V | tail -1) || true
          if [ -z "$crt" ]; then
            echo "::error::no Microsoft.VC<n>.CRT directory under $redist, so there is no runtime to put beside the window"
            exit 1
          fi
          # Which DLLs to carry is read off the staged tree rather than left to a fixed list, so a
          # Qt that reaches for one more cannot leave it behind: a PE names every DLL it imports in
          # plain ASCII, the same reading that proves the command-line binary names none of them.
          imported=$(find stage-gui \( -name '*.dll' -o -name '*.exe' \) \
            -exec grep -aoih '\(msvcp\|vcruntime\|concrt\)[0-9][0-9a-z_]*\.dll' {} + \
            | tr 'A-Z' 'a-z' | sort -u) || true
          if [ -z "$imported" ]; then
            echo "::error::nothing staged names a runtime DLL at all, so that reading found nothing and proves nothing"
            exit 1
          fi
          # The three Qt's Windows libraries import are named outright as well: a reading that
          # ever stopped recognising the tree would otherwise take the runtime out with it.
          carried=$(printf '%s\n' vcruntime140.dll vcruntime140_1.dll msvcp140.dll $imported | sort -u)
          for dll in $carried; do
            if [ ! -f "$crt/$dll" ]; then
              echo "::error::the staged tree needs $dll and $crt does not have it to give"
              exit 1
            fi
            cp "$crt/$dll" stage-gui/
          done
          echo "from $crt, the window now carries:" $carried
      - name: Zip
        shell: bash
        # Each archive is named for the package it carries, and each installer for the package
        # it installs, so the four Windows files on a release page say which is which. Only the
        # names changed for the command line: its installer still writes the same directory and
        # the same registry key, so a machine carrying an earlier release upgrades in place
        # rather than gaining a second copy.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd stage && 7z a "../taffle-cli-$VERSION-x86_64-windows.zip" .)
          (cd stage-gui && 7z a "../taffle-gui-$VERSION-x86_64-windows.zip" .)
      - name: Build both installers
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Pinned like every other toolchain in this workflow: this compiler builds
          # an artifact that runs elevated on a user's machine, so an unpinned bump
          # must not land unreviewed.
          choco install nsis --version=3.12.0 -y
          # -NOCD: makensis otherwise cd's to the script's directory, so the
          # relative File "stage\..." paths would resolve under packaging/windows.
          "/c/Program Files (x86)/NSIS/makensis.exe" -NOCD -DVERSION="$VERSION" packaging/windows/installer.nsi
          "/c/Program Files (x86)/NSIS/makensis.exe" -NOCD -DVERSION="$VERSION" packaging/windows/installer-gui.nsi
      - name: Install the command line with its installer and prove it did what it claims
        shell: pwsh
        # A quoting mistake in the installer script yields an installer that builds
        # and runs cleanly while its PATH edit does nothing at all, so the only way
        # to know the edit works is to perform it and read the machine PATH back.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Start-Process -Wait "taffle-cli-$env:VERSION-x86_64-setup.exe" -ArgumentList "/S"
          $p = [Environment]::GetEnvironmentVariable('Path','Machine')
          if ($p -notlike "*taffle*") { throw "the installer did not put taffle on the machine PATH" }
          & "$env:ProgramFiles\taffle\taffle.exe" --version
      - name: Install the window with its installer and put it through its own smoke
        shell: pwsh
        # The window is proven the only way a bundled Qt tree can be: install it and start it.
        # The self-test boots the whole chrome, drives a fake batch through it and exits, so a
        # library or a QML module windeployqt did not bundle fails here rather than on the first
        # user's machine — and it is run against what the installer left in Program Files, never
        # the staged tree it was built from.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Start-Process -Wait "taffle-gui-$env:VERSION-x86_64-setup.exe" -ArgumentList "/S"
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\taffle-gui"
          if (-not (Test-Path $key)) { throw "the installer wrote no uninstall entry, so Settings > Apps would not list the install" }
          # The shortcut is asserted for the same reason as the entry above: it is the only way in
          # to a program this installer deliberately keeps off PATH. The installer writes it into
          # the Start menu of the account that ran it, which is the account running this step.
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Taffle.lnk"
          if (-not (Test-Path $lnk)) { throw "the installer left no shortcut at $lnk, so a user would have nothing to start the window with" }
          # This job put Qt's own bin directory on PATH to build against. Leaving it there would
          # let a DLL the installer never laid down be found in that install instead, and the
          # run would pass on a machine no user has. An unset QT_BIN would leave that filter
          # matching nothing while still looking like it ran, so it is checked rather than trusted.
          if (-not $env:QT_BIN) { throw "QT_BIN is unset, so the filter below would take nothing off PATH and Qt's own build would still be on it" }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -ne $env:QT_BIN }) -join ';'
          # No display server and a software scene graph, the pair the crate's own smoke test
          # puts on the run. The Qt Quick Controls style is left at whatever the platform picks,
          # where that test pins it to Basic: which style Windows resolves to is part of what
          # windeployqt had to bundle, and pinning Basic would pass with it missing.
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          & "$env:ProgramFiles\taffle-gui\taffle-gui.exe" --smoke
          if ($LASTEXITCODE -ne 0) { throw "the installed window failed its own self-test (exit $LASTEXITCODE)" }
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "${{ needs.prepare.outputs.is_release }}" != "true" ]; then exit 0; fi
          gh release upload "v$VERSION" \
            "taffle-cli-$VERSION-x86_64-windows.zip" \
            "taffle-cli-$VERSION-x86_64-setup.exe" \
            "taffle-gui-$VERSION-x86_64-windows.zip" \
            "taffle-gui-$VERSION-x86_64-setup.exe" --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: windows, path: "taffle-*-x86_64-*" }

  checksums:
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, deb, arch, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hashing what the release actually holds, rather than what each build job
      # believed it uploaded, is what makes this file describe the release.
      - name: Download every release asset and hash it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir dl && cd dl
          gh release download "v$VERSION" --repo "${GITHUB_REPOSITORY}"
          # SHA256SUMS is itself an asset of the release it describes, so a re-run of
          # this job downloads the previous one alongside the packages. Remove it before
          # hashing, or it ends up in its own successor with a hash of its old contents.
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --repo "${GITHUB_REPOSITORY}"
