[package]
name = "taffle-cli"
version.workspace = true
description = "Convert audiobooks and music into Tonie Audio Format (TAF) files for teddycloud-backed Tonieboxes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "taffle"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
taffle = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# What the binary wrote is read back by `taf`'s own validator rather than by anything this crate
# builds, so a test states what is in the file and not what the code that wrote it believes.
taf = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# Two packages rather than one: this is what somebody who only ever runs the command line
# installs, and it pulls in no Qt. The binary inside is still `taffle` — the split is between
# packages, not between commands.
#
# `depends` is left at cargo-deb's `$auto`, which resolves it with dpkg-shlibdeps
# against the binary in the distro the package was built in. That is why every deb
# is built inside its own distro's container rather than sharing one build: each
# resolves the libopus package name its own distro uses.
[package.metadata.deb]
name = "taffle-cli"
# The shipped package was named `taffle`; these three are Debian's rename protocol, so a user
# installing this file over that install gets a clean swap rather than a file conflict.
conflicts = "taffle"
replaces = "taffle"
provides = "taffle"
maintainer = "mhert <mathias@mh.cx>"
# Without this, cargo-deb writes a /usr/share/doc/taffle-cli/copyright that names no
# license text at all, and Debian Policy asks every package to carry a verbatim
# copy of its license. The path is relative to this crate, so it climbs to the
# workspace root; nothing is skipped because the file is license text from its
# very first line.
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
assets = [
    ["target/release/taffle", "usr/bin/taffle", "755"],
]
