[package]
name = "taffle-gui"
version.workspace = true
description = "Qt GUI for converting audiobooks into Tonie Audio Format (TAF) files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "taffle-gui"
path = "src/main.rs"

[dependencies]
taffle = { workspace = true }
thiserror = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }

# This crate cannot inherit the workspace [lints] table, which forbids unsafe code. It mirrors
# that table verbatim EXCEPT unsafe_code = "deny" (not "forbid"), so the cxx-qt bridge
# (src/bridge.rs) can opt out with scoped, // SAFETY:-commented exceptions.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"   # matches the workspace's stated opt-outs
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket

# cargo-deb reads this. Depends stays at $auto: the release job builds inside each distro's own
# container, so dpkg-shlibdeps resolves that distro's Qt and opus package names — one metadata
# table is correct for both distros.
[package.metadata.deb]
name = "taffle-gui"
maintainer = "mhert <mathias@mh.cx>"
# Debian Policy asks every package to carry a verbatim copy of its license, and without this
# cargo-deb writes a copyright file that names none. The 0 is how many leading lines to skip:
# none, because the file is license text from its very first line.
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
assets = [
    ["target/release/taffle-gui", "usr/bin/taffle-gui", "755"],
    ["../../packaging/linux/taffle-gui.desktop", "usr/share/applications/taffle-gui.desktop", "644"],
    ["../../packaging/linux/taffle.svg", "usr/share/icons/hicolor/scalable/apps/taffle.svg", "644"],
]
