[package]
name = "taffle-gui"
version.workspace = true
description = "Qt GUI for converting audiobooks into Tonie Audio Format (TAF) files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "taffle-gui"
path = "src/main.rs"

[dependencies]
taffle = { workspace = true }
thiserror = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }

# This crate cannot inherit the workspace [lints] table, which forbids unsafe code. It mirrors
# that table verbatim EXCEPT unsafe_code = "deny" (not "forbid"), so the cxx-qt bridge
# (src/bridge.rs) can opt out with scoped, // SAFETY:-commented exceptions.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"   # matches the workspace's stated opt-outs
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket

# cargo-deb reads this.
[package.metadata.deb]
name = "taffle-gui"
# `$auto` is dpkg-shlibdeps, which reads the binary's linked libraries: it resolves Qt and opus
# to whatever the distro the deb was built in calls them, which is why every deb is built inside
# its own distro's container. What it cannot see is a QML plugin — the engine dlopens those by
# module URI while the app runs, and nothing in the ELF names them — so they are listed by hand.
# Leave them out and the package installs onto a machine carrying the Qt libraries alone, starts,
# and then fails to load its whole chrome. The list runs longer than the import lines in qml/
# because a plugin brings its own: Controls is QML written over Templates, and the
# ApplicationWindow it hands back is a Window. QtQml itself brings two more — its qmldir pulls
# QtQml.Models and QtQml.WorkerScript in through `auto` import lines the engine follows on every
# load, so no import line in qml/ names them either. Whether a distro's own package dependencies
# happen to chain those two in differs between distros, so they are named here rather than leaned
# on. Debian and Ubuntu spell all nine the same, so one table stays right for both.
depends = "$auto, qml6-module-qtqml, qml6-module-qtqml-models, qml6-module-qtqml-workerscript, qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-templates, qml6-module-qtquick-window, qml6-module-qtquick-dialogs"
maintainer = "mhert <mathias@mh.cx>"
# Debian Policy asks every package to carry a verbatim copy of its license, and without this
# cargo-deb writes a copyright file that names none. The 0 is how many leading lines to skip:
# none, because the file is license text from its very first line.
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
assets = [
    ["target/release/taffle-gui", "usr/bin/taffle-gui", "755"],
    ["../../packaging/linux/taffle-gui.desktop", "usr/share/applications/taffle-gui.desktop", "644"],
    ["../../packaging/linux/taffle.svg", "usr/share/icons/hicolor/scalable/apps/taffle.svg", "644"],
]
