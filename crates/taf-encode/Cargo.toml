[package]
name = "taf-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ogg = "0.9"
opus = "0.3"
# Default features on: the FFT resampler is the one this crate uses.
rubato = "0.16"
sha1 = { workspace = true }
symphonia = { version = "0.5", features = [
    "mp3",
    "aac",
    "isomp4",
    "wav",
    "pcm",
    "adpcm",
    "flac",
    "ogg",
    "vorbis",
] }
taf = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
