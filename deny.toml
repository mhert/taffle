[advisories]
version = 2
ignore = [
    # The sys crate the `opus` bindings link libopus through. The advisory reports no
    # vulnerability: it says the crate is unmaintained, that no upgrade exists, and that the
    # vendored libopus it falls back to building does not build under CMake 4. That fallback is
    # not the path taken here — every build links the system libopus that pkg-config finds, which
    # is what CI installs — so what is left is a binding to a stable C API that nobody is changing.
    { id = "RUSTSEC-2026-0150", reason = "audiopus_sys is unmaintained with no upgrade available; the vendored CMake build it warns about is never used, as libopus is linked from the system" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "MPL-2.0", "ISC", "Zlib"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
